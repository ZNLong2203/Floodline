- id: kerb_urban_street
  category: street_furniture
  name_en: Kerb (bó vỉa) at pavement edge or traffic island, Vietnamese urban street
  name_vi: Bó vỉa đường đô thị
  sam_prompt: curb
  sam_prompt_alternatives:
  - kerb
  - sidewalk curb
  - road curb
  threshold_class: null
  suitability: low
  derivation: 'TCVN 13592:2022 clause 9.7.4: kerb crest of pavement or traffic island at least 12.5 cm above the carriageway edge (not
    mandatory at ramps, wheelchair access, low-speed commercial/residential streets V <= 30 km/h and pedestrian streets). Clause 9.7.5:
    median kerb crest at least 30 cm above the road, reducible with justification to no less than 15 cm where design speed < 50 km/h.'
  height_total_m:
    typical: 0.125
    low: 0.125
    high: 0.3
  height_total_definition: 'Height of kerb crest above carriageway edge. typical is set equal to the MINIMUM (0.125 m): the standard
    gives only minima, so real kerbs are probably higher (not sourced).'
  scale_dimensions: []
  landmarks:
  - id: kerb_crest
    name_en: Kerb crest above carriageway
    name_vi: Đỉnh bó vỉa
    height_m:
      typical: 0.125
      low: 0.125
      high: 0.3
    basis: national_standard_minimum
    source_ids:
    - tcvn_13592_2022_atld
  unverified: true
  unverified_fields:
  - height_total_m.typical (real-world kerb height)
  unverified_reason: Standard gives minimums only; as-built kerb heights vary and ramps/low-speed streets are exempt. TCXDVN 104:2007
    could not be read; the value comes from its current replacement TCVN 13592:2022. Submerged kerbs are also hard to see in photos.
  source_ids:
  - tcvn_13592_2022_atld
