    name_en: Bottom edge of sign panel above road surface
    name_vi: Mép dưới biển báo
    height_m:
      typical: 2.0
      low: 1.2
      high: 5.0
    basis: official_spec
    source_ids:
    - qcvn_41_2019_art22
    note: 2.0 m inside built-up areas (1.8 m outside); 1.2 and 5.0 are the outer limits for special cases. Useful only for deep water
      (> ~1 m) or road-surface checks; legacy signs may not comply.
