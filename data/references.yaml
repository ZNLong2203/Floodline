  sam_prompt: utility pole
  sam_prompt_alternatives:
  - electric pole
  - power pole
  threshold_class: null
  suitable: false
  suitability: unsuitable
  unsuitable_reason: Total pole length is a family of standard sizes (TCVN 5847:1994 covered 10-20 m centrifugal concrete poles; the
    2016 tables were not read) while the part above ground depends on the embedment depth chosen per site. No standard feature (cross-arm,
    label plate, fixed band) at a known low height was found, and the base is often hidden by vehicles, signage and water. It cannot
    give a metric scale or a landmark near a typical street waterline.
  height_total_m:
    typical: null
    low: null
    high: null
  scale_dimensions: []
  landmarks: []
  source_ids:
  - tcvn_5847_2016
