    note: 'Urban roads (coefficient 1): circle D = 0.70 m, octagon D = 0.60 m, triangle side = 0.70 m. Road type and legacy signs vary;
      rectangular sign sizes not read.'
  - id: post_diameter
    view: front
    typical_m: 0.08
    low_m: 0.075
    high_m: 0.085
    source_ids:
