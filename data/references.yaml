# Floodline reference objects (generated 2026-10-27). Every value has source_ids resolving to the sources list below.
# Vietnamese names (*_vi) are UTF-8. Null + unverified: true means the value could not be sourced and was deliberately not guessed.
schema_version: 1
generated_on: '2026-10-27'
project: Floodline
purpose: 'Reference objects of known size for estimating street floodwater depth from photos (fraction of the object above the waterline).
  Every number carries source_ids; anything not sourced is null with unverified: true and a reason.'
conventions:
  units: metres unless a key ends in _mm
  height_total_m: typical / low / high. For single-model objects low = high = typical (no trim variation published). For generic objects
    typical = median and low/high = min/max over listed models.
  scale_dimensions: Horizontal dimensions that stay visible when the lower part of the object is under water.
  landmarks: height_m is measured from the road surface to the feature. basis = official_spec | derived_from_tyre_size | derived_from_proportion
    | national_standard_minimum | definition | not_published.
  tyre_outer_diameter_formula: outer_diameter_mm = rim_in*25.4 + 2*section_width_mm*aspect_ratio_pct/100 (Wikipedia Tire code); hub_height
    = outer_diameter/2, nominal unloaded value (loaded radius is somewhat smaller)
  tyre_size_reading: 'Motorcycle "W/A-R" (e.g. 80/90-17): W = section width mm, A = aspect ratio %, R = rim in. The same formula is
    applied (reading per Wikipedia Motorcycle tire; the article does not show the hyphen notation).'
  unverified_policy: 'If a number could not be sourced it is null (never guessed) and flagged unverified: true with reason. Values read
    from secondary/tertiary sources are marked by reliability in the sources list.'
  suitability_scale: high = dimensions published and tightly controlled; medium = usable with a wider range or only some views; low
    = wide variation or unsourced typical value, use only as a secondary cue; unsuitable = do not use.
  threshold_class: Links each vehicle/person to a class in thresholds.yaml.
