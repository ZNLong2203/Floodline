  derivation: 'QCVN 41:2019/BGTVT: sign bottom edge to road surface 2.0 m in built-up areas (1.8 m outside); sign groups lowest edge
    2.0 m / 1.7 m; signs for pedestrians and non-motorised vehicles 1.8 m above road/shoulder/pavement; special cases 1.2-5.0 m (No.507
    "Hướng rẽ" 1.2-1.5 m).'
  height_total_m:
    typical: null
    low: null
    high: null
  height_total_definition: Pole total height is not in the retrieved excerpt of Article 24.
  unverified: true
  unverified_fields:
  - height_total_m
  unverified_reason: Pole height above ground and burial depth are not in the retrieved excerpt of QCVN 41:2019 Article 24; the sign-bottom
