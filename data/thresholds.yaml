- id: boat_only
  label_en: Boat only (no wading or road vehicles)
  label_vi: Chỉ đi được bằng thuyền/xuồng
  min_depth_m: 0.5
  mandatory_above_m: 1.2
  boat_only_if_dv_above_m2s: 1.2
  max_depth_m: null
  max_depth_flowing_m: null
  unverified: false
  derivation: min_depth_m = max(max_depth_m over land classes) = max(pedestrian_adult 0.5, truck_rescue 0.5, suv_pickup 0.4, sedan_car
    0.3, pedestrian_child_elderly 0.25, scooter 0.21) = 0.5 (derived within this file, no external source).
  selection: 'min_depth_m = the highest max_depth_m of any land class here (0.5 m: adult, truck proxy), i.e. beyond it no land class
    is rated passable. mandatory_above_m = 1.2 m, the still-water depth above which no source accepts wading even for adults. boat_only_if_dv_above_m2s
    = 1.2, above which Cox et al. rate flow "extreme hazard, dangerous to all".'
  evidence:
  - field: mandatory_above_m
    value: 1.2
    source_id: wrl_2014_07
    locator: p.3 (SCARM 2000 App. J) and p.17 (Cox et al. 2010)
    statement: Wading by able-bodied adults "becomes difficult and dangerous when the depth of still water exceeds 1.2 m"; adults' maximum
      depth limit 1.2 m.
    kind: verbatim
  - field: mandatory_above_m
    value: 1.2
    source_id: aidr_guideline_7_3
    locator: Table 2, H3 -> H4
    statement: H3 limit D = 1.2 m; H4 (D <= 2.0 m) "Unsafe for vehicles and people"; H5/H6 add building damage (D*V > 1.0, > 4.0 m2/s).
    kind: verbatim
  - field: boat_only_if_dv_above_m2s
    value: 1.2
    source_id: wrl_2014_07
    locator: Table 4-1 (Cox et al. 2010)
    statement: 'D x V > 1.2 m2/s: "Extreme Hazard; Dangerous to all" for adults and children.'
    kind: verbatim
  note: Between min_depth_m and mandatory_above_m only trained rescuers (D x V <= 0.8 m2/s working limit, Cox et al.) or high vehicles
    with local approval should proceed; for the tool output both ranges mean "boat recommended / boat required".
