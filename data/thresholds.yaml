# Floodline passability thresholds (generated 2026-10-27). Conservative; every class lists evidence with source ids.
# unverified: true marks numbers that could not be traced to a source statement about that class.
schema_version: 1
generated_on: '2026-10-27'
project: Floodline
purpose: Depth thresholds for passability by user class. Depth = height of the water surface above the road surface at the person/vehicle.
  Every number has evidence entries pointing at sources[]; numbers that could not be sourced are flagged unverified.
conventions:
  max_depth_m: Still (or slow, <= ~0.5 m/s) water. Passage is NOT recommended above this depth. Conservative selection, see each class
    "selection".
  max_depth_flowing_m: Water that is visibly moving (current, wake, drifting debris). Always <= max_depth_m.
  caution_depth_m: 'Depth at which a documented hazard begins; between caution_depth_m and max_depth_m: proceed only with care. null
    = no sourced value.'
  max_dv_m2s: 'Optional depth x velocity limit (m2/s) when velocity is known: pass if depth x velocity <= this value AND depth <= max_depth_m.'
  source_ceiling: The highest value found in any source for that class (never used as the limit).
  evidence_kind: verbatim = number appears in the source; derived = computed from sourced numbers (formula shown); proxy = taken from
    a different but related class; rule_applied_by_analogy = a depth rule written for another vehicle type; manufacturer_claim_via_press
    = secondary report of a manufacturer figure.
  decision_rule: state = no_go if depth > max_depth_m (use max_depth_flowing_m when water is moving); caution if caution_depth_m <=
    depth <= max_depth_m; ok otherwise. boat_only applies when depth > boat_only.min_depth_m.
  unverified_policy: 'unverified: true with unverified_fields and unverified_reason on any class whose listed fields could not be traced
    to a source statement about that class.'
classes:
- id: pedestrian_adult
  label_en: Pedestrian - healthy adult wading
  label_vi: Người đi bộ (người lớn khỏe mạnh)
  max_depth_m: 0.5
  max_depth_flowing_m: 0.15
  caution_depth_m: 0.25
  max_dv_m2s: 0.6
  source_ceiling:
    still_m: 1.2
    flowing_m: null
    note: 1.2 m is the highest still-water wading depth any retrieved source accepts for an able-bodied adult; it is NOT used as the
      limit.
  unverified: false
  selection: max_depth_m is the ARR/AIDR H2 still-water limit (0.5 m, verbatim). It is deliberately well under the 1.2 m adult ceiling
    because (a) FD2321 with an urban debris factor reaches "dangerous for most people" at exactly 0.5 m in still water, and (b) a photo
    cannot show open drains, current or footing (SCARM App. J).
  evidence:
  - field: max_depth_m
    value: 0.5
    source_id: aidr_guideline_7_3
    locator: Table 2, class H2 limiting still-water depth
    statement: 'H2: D*V <= 0.6 m2/s, D <= 0.5 m, V <= 2.0 m/s; Table 1 says H2 is only "unsafe for small vehicles". H3 (D <= 1.2 m)
      adds "children and the elderly"; adults are first flagged at H4.'
    kind: verbatim
  - field: source_ceiling.still_m
    value: 1.2
    source_id: wrl_2014_07
    locator: p.17 quoting Cox et al. 2010; Table 4-1 note 1; p.3 quoting SCARM 2000 App. J
    statement: 'Adults (H.M > 50 mKg): low hazard for D.V < 0.6 m2/s "with a maximum depth limit of 1.2 m"; SCARM: wading by able-bodied
      adults "becomes difficult and dangerous when the depth of still water exceeds 1.2 m"; also depends on "evenness of the ground
      surface or presence of depressions, potholes, fences or major stormwater drains".'
    kind: verbatim
  - field: max_depth_m
    value: 0.5
    source_id: defra_fd2321_tr2
    locator: Table 4.1 (debris factor, urban) and Table 4.2 (classes); formula HR = d x (v + 0.5) + DF
    statement: 'Urban DF = 1 for d > 0.25 m. At v = 0, d = 0.5 m: HR = 0.5 x 0.5 + 1 = 1.25 = lower bound of "Significant - dangerous
      for most people". At d <= 0.25 m DF = 0, HR <= 0.125 = Low.'
    kind: derived
  - field: caution_depth_m
    value: 0.25
    source_id: defra_fd2321_tr2
    locator: Table 4.1 first depth band (0 to 0.25 m)
    statement: Above 0.25 m the urban debris factor jumps from 0 to 1, moving still water from "Low" to "Dangerous for some" (HR 1.125-1.25
      between 0.25 and 0.5 m).
    kind: derived
  - field: max_depth_flowing_m
    value: 0.15
    source_id: govuk_flash_flooding
    locator: Flash flooding guidance
    statement: '"Shallow flood water (around 15cm or 6 inches) ... can knock a person over or conceal hazards."'
    kind: verbatim
  - field: max_depth_flowing_m
    value: 0.15
    source_id: nws_tadd_safety
    locator: Turn Around Don't Drown
    statement: '"A mere 6 inches of fast-moving flood water can knock over an adult."'
    kind: verbatim
  - field: max_depth_flowing_m
    value: 0.15
    source_id: nws_tadd_tsa
    locator: Turn Around Don't Drown (older wording)
    statement: '"Six inches of moving water can make you fall."'
    kind: verbatim
  - field: max_dv_m2s
    value: 0.6
    source_id: wrl_2014_07
    locator: Table 4-1 (after Cox et al. 2010)
    statement: 'Adults: D x V < 0.6 m2/s low hazard; 0.6-0.8 moderate; 0.8-1.2 significant ("dangerous to most"); > 1.2 extreme ("dangerous
      to all"). Max velocity stability limit 3.0 m/s.'
    kind: verbatim
  note: Flowing = water visibly moving (current, wake, debris drifting). If velocity can be estimated, use D x V <= 0.6 m2/s instead
    of the flat depth.
  source_ids:
  - aidr_guideline_7_3
  - wrl_2014_07
  - defra_fd2321_tr2
  - govuk_flash_flooding
  - nws_tadd_safety
  - nws_tadd_tsa
