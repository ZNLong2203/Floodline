reference_tables:
  arr_aidr_combined_hazard:
    source_id: aidr_guideline_7_3
    locator: Tables 1 and 2 (after Smith and Wasko 2012; Smith et al. 2014)
    rows:
    - cls: H1
      description: Generally safe for vehicles, people and buildings.
      dv_limit_m2s: 0.3
      depth_limit_m: 0.3
      velocity_limit_ms: 2.0
    - cls: H2
      description: Unsafe for small vehicles.
      dv_limit_m2s: 0.6
      depth_limit_m: 0.5
      velocity_limit_ms: 2.0
    - cls: H3
      description: Unsafe for vehicles, children and the elderly.
      dv_limit_m2s: 0.6
      depth_limit_m: 1.2
      velocity_limit_ms: 2.0
    - cls: H4
      description: Unsafe for vehicles and people.
      dv_limit_m2s: 1.0
      depth_limit_m: 2.0
      velocity_limit_ms: 2.0
    - cls: H5
      description: Unsafe for vehicles and people. All building types vulnerable to structural damage. Some less robust building types
        vulnerable to failure.
      dv_limit_m2s: 4.0
      depth_limit_m: 4.0
      velocity_limit_ms: 4.0
    - cls: H6
      description: Unsafe for vehicles and people. All building types considered vulnerable to failure.
      dv_limit_m2s: '> 4.0'
      depth_limit_m: null
      velocity_limit_ms: null
  vehicle_stability_shand_2011:
    source_id: wrl_2014_07
    locator: Table 4-2 (draft interim criteria, stationary vehicles)
    rows:
    - cls: small_passenger
      length_m: < 4.3
      kerb_weight_kg: < 1250
      ground_clearance_m: < 0.12
      still_water_depth_m: 0.3
      depth_at_3ms_m: 0.1
      max_velocity_ms: 3.0
      dv_limit_m2s: 0.3
    - cls: large_passenger
      length_m: '> 4.3'
      kerb_weight_kg: '> 1250'
      ground_clearance_m: '> 0.12'
      still_water_depth_m: 0.4
      depth_at_3ms_m: 0.15
      max_velocity_ms: 3.0
      dv_limit_m2s: 0.45
    - cls: large_4wd
      length_m: '> 4.5'
      kerb_weight_kg: '> 2000'
      ground_clearance_m: '> 0.22'
      still_water_depth_m: 0.5
      depth_at_3ms_m: 0.2
      max_velocity_ms: 3.0
      dv_limit_m2s: 0.6
  people_stability_cox_2010:
    source_id: wrl_2014_07
    locator: p.17 quoting Cox et al. 2010 (and Table 4-1)
    adults_height_mass_product_above_50_mkg:
    - dv_m2s: < 0.6
      hazard: Low hazard (max depth 1.2 m; max velocity 3.0 m/s at D < 0.3 m)
    - dv_m2s: 0.6 - 0.8
      hazard: Moderate hazard; dangerous to some; 0.8 is the working limit for trained safety workers or experienced, well-equipped
        persons
    - dv_m2s: 0.8 - 1.2
      hazard: Significant hazard; dangerous to most; 1.2 is the upper limit of stability seen in most investigations
    - dv_m2s: '> 1.2'
      hazard: Extreme hazard; dangerous to all; should not be considered safe for standing or traversing
    children_height_mass_product_25_to_50_mkg:
    - dv_m2s: < 0.4
      hazard: Low hazard (max depth 0.5 m regardless of velocity; max velocity 3.0 m/s at D < 0.2 m)
    - dv_m2s: 0.4 - 0.6
      hazard: Significant hazard; dangerous to most (Table 4-1)
    - dv_m2s: 0.8 - 1.2 and above
      hazard: Extreme hazard; dangerous to all (Table 4-1; the 0.6-0.8 children cell is merged in the extracted PDF text and is not
        reproduced)
    notes:
    - More vulnerable community members such as infants and the elderly should avoid exposure to floodwater under all conditions (Table
      4-1 note 2).
  defra_fd2321:
    source_id: defra_fd2321_tr2
    locator: Section 4 Tables 4.1-4.2
    corroborating_source_ids:
    - defra_fd2321_tr1
    formula: HR = d x (v + 0.5) + DF
    debris_factor:
      urban:
        d_0_to_0_25: 0
        d_0_25_to_0_75: 1
        d_above_0_75_or_v_above_2: 1
      woodland:
        d_0_to_0_25: 0
        d_0_25_to_0_75: 0.5
        d_above_0_75_or_v_above_2: 1
      pasture_arable:
        d_0_to_0_25: 0
        d_0_25_to_0_75: 0
        d_above_0_75_or_v_above_2: 0.5
    classes:
    - hr: < 0.75
      degree: Low
      description: Caution
    - hr: 0.75 - 1.25
      degree: Moderate
      description: Dangerous for some (i.e. children)
    - hr: 1.25 - 2.5
      degree: Significant
      description: Dangerous for most people
    - hr: '> 2.5'
      degree: Extreme
      description: Dangerous for all
    note: Designed for floodplain mapping, not street wading; used here only as a cross-check and to bound still-water depth for people
      in urban settings.
  nws_statements:
    source_ids:
    - nws_tadd_tsa
    - nws_tadd_safety
    statements:
    - 6 inches (0.15 m) of moving water can make you fall / knock over an adult.
    - 6 inches of water reaches the bottom of most passenger cars (loss of control, possible stalling).
    - '12 inches (0.30 m): float many vehicles (tsa page); carry away most cars in rushing water (national page).'
    - 2 feet (0.61 m) of rushing water carries away most vehicles incl. SUVs and pickups.
  govuk_statements:
    source_id: govuk_flash_flooding
    statements:
    - 15 cm (6 in) can knock a person over or conceal hazards.
    - 60 cm (2 ft) can carry away a vehicle of any size.
  vicses_statements:
    source_id: vicses_15_to_float
    statements:
    - 'Moving water at 3.6 km/h: small car (1.05 t) 15 cm; mid-sized car (1.5 t) 30 cm; four-wheel drive (2.5 t) 45 cm.'
limitations:
- Depth from a photo has an error of several centimetres; thresholds are small enough that a +/- 5 cm error can change the state. Report
  the interval, not a point.
- Velocity cannot be measured from one photo. Use max_depth_flowing_m whenever there is any sign of current.
- The Australian vehicle criteria (Shand et al. 2011) are described by their authors as draft interim values; they apply to stationary
  vehicles in a flow, not to moving vehicles.
- No source read gives a depth rule specific to Vietnamese motorbikes or to Vietnamese army/rescue trucks.
- ford.com.vn blocked automated access (HTTP 403) and the Australian Rainfall and Runoff Book 6 PDF returned 403; the Ford ratings and
  ARR classes are taken from secondary/mirror documents named in the sources.
- Hazards below the waterline (open manholes, collapsed road, debris) are not modelled and make every threshold less conservative than
  it looks.
