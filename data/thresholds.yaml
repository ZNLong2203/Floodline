- id: sedan_car
  label_en: Sedan / hatchback car (Vios, Accent, Morning class)
  label_vi: Ô tô con (sedan, hatchback)
  max_depth_m: 0.3
  max_depth_flowing_m: 0.15
  caution_depth_m: 0.15
  max_dv_m2s: 0.3
