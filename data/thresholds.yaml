- id: suv_pickup
  label_en: SUV / MPV / pickup (Xpander, Ranger class)
  label_vi: Xe gầm cao (SUV, MPV, bán tải)
  max_depth_m: 0.4
  max_depth_flowing_m: 0.3
  caution_depth_m: 0.225
  max_dv_m2s: 0.45
  source_ceiling:
    still_m: 0.8
    flowing_m: 0.45
    note: 0.8 m = Ford Ranger Hi-rider rated wading depth (Ford Việt Nam via trade press); 0.45 m = VicSES four-wheel drive (2.5 t)
      in moving water. Neither is used as the limit.
  per_vehicle:
  - vehicle: car_mitsubishi_xpander
    max_depth_m: 0.4
    basis: Shand large passenger car 0.4 m; Mitsubishi Việt Nam rating for the Xpander CROSS 0.4 m (press); hub height 0.329-0.330 m.
  - vehicle: car_ford_ranger
    max_depth_m: 0.5
    basis: Shand large 4WD 0.5 m (> 2000 kg, ground clearance > 0.22 m); hub height 0.382-0.394 m; Ford rates only the Hi-rider at 0.8
      m, standard 4x2 "not the whole tyre".
  manufacturer_ratings:
  - vehicle: Ford Ranger Hi-rider
    wading_m: 0.8
    source_id: ford_vn_flood_advice
    reliability: secondary (trade press reporting Ford Việt Nam)
  - vehicle: Mitsubishi Xpander Cross
    wading_m: 0.4
    source_id: thuonghieucongluan_xpander_cross
    reliability: secondary (press attributing the figure to Mitsubishi Motors Việt Nam, 2020)
  unverified: true
  unverified_fields: &id003
  - caution_depth_m
  unverified_reason: caution_depth_m is the smallest published ground clearance in the class (Xpander 0.225 m); treating it as the onset
    of underbody wetting is our inference. Manufacturer wading depths come from press reports, not from Ford/Mitsubishi spec sheets
    (ford.com.vn returned 403; the Mitsubishi Xpander spec page lists no wading depth).
  selection: 0.4 m = lowest of Shand large passenger (0.4) and the Xpander Cross rating (0.4); pickups heavier than 2 t may use 0.5
    m (Shand large 4WD) via per_vehicle. Flowing 0.3 m = VicSES mid-sized car (1.5 t, comparable to Xpander 1.25-1.28 t).
  evidence:
  - field: max_depth_m
    value: 0.4
