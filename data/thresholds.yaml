unverified_summary:
- class_id: pedestrian_child_elderly
  fields: *id001
  reason: No child- or elderly-specific flowing-water figure beyond the Cox et al. laboratory value (D < 0.2 m at 3 m/s, children only).
    0.15 m is the general-person value (GOV.UK / NWS) applied as a conservative cap.
- class_id: scooter
  fields: *id002
  reason: 'Neither Honda Việt Nam, Yamaha Việt Nam, nor any Vietnamese government source read gives a numeric safe depth, stall depth,
    exhaust height or air-intake height for motorbikes. max_depth_m is DERIVED by applying the "water not above the wheel hub/axle"
    rule (Sở GTVT Đà Nẵng handbook, written for cars; Kia owner manual) to the smallest wheel hub height among the five reference motorbikes
    (Honda LEAD rear 100/90-10: 0.217 m, rounded down to 0.21). caution_depth_m is the smallest published ground clearance (Wave Alpha
    0.134 m); that it marks the onset of engine/exhaust wetting is our inference, not a source statement. max_depth_flowing_m reuses
    the lowest cited moving-water figure (15 cm) because no motorbike figure exists.'
- class_id: suv_pickup
  fields: *id003
  reason: caution_depth_m is the smallest published ground clearance in the class (Xpander 0.225 m); treating it as the onset of underbody
    wetting is our inference. Manufacturer wading depths come from press reports, not from Ford/Mitsubishi spec sheets (ford.com.vn
    returned 403; the Mitsubishi Xpander spec page lists no wading depth).
- class_id: truck_rescue
  fields: *id004
  reason: 'No wading/fording depth for any Vietnamese army or rescue truck was found (Wikipedia Ural-4320 and KamAZ-4310 pages give
    no fording depth; Vietnam is not listed as operator on those pages). Shand et al. (2011) state they have no data for "small and
    large commercial vehicles and emergency service vehicles". Values are PROXIES: the heaviest classes in the cited criteria (Shand
    large 4WD still 0.5 m, D.V <= 0.6; VicSES 4WD moving 0.45 m).'
