- id: scooter
  label_en: Scooter / motorbike (xe máy, rider on board)
  label_vi: Xe máy (xe tay ga, xe số)
  max_depth_m: 0.21
  max_depth_flowing_m: 0.15
  caution_depth_m: 0.134
  max_dv_m2s: null
  source_ceiling:
    still_m: null
    flowing_m: null
    note: No manufacturer or government depth limit for motorbikes was found.
  unverified: true
  unverified_fields: &id002
  - max_depth_m
  - max_depth_flowing_m
  - caution_depth_m
  - max_dv_m2s
  unverified_reason: 'Neither Honda Việt Nam, Yamaha Việt Nam, nor any Vietnamese government source read gives a numeric safe depth,
    stall depth, exhaust height or air-intake height for motorbikes. max_depth_m is DERIVED by applying the "water not above the wheel
    hub/axle" rule (Sở GTVT Đà Nẵng handbook, written for cars; Kia owner manual) to the smallest wheel hub height among the five reference
    motorbikes (Honda LEAD rear 100/90-10: 0.217 m, rounded down to 0.21). caution_depth_m is the smallest published ground clearance
    (Wave Alpha 0.134 m); that it marks the onset of engine/exhaust wetting is our inference, not a source statement. max_depth_flowing_m
    reuses the lowest cited moving-water figure (15 cm) because no motorbike figure exists.'
  selection: Conservative derived value, flagged unverified. Hub heights of the five reference motorbikes are 0.217-0.300 m (see references.yaml);
    official ground clearance 0.134-0.175 m.
  evidence:
  - field: max_depth_m
    value: 0.21
    source_id: tuoitre_danang_handbook
    locator: Handbook rule as quoted
    statement: '"độ sâu ngập nước không vượt qua tâm bánh (trục bánh xe)" - water not above the wheel centre; the article does not say
      motorbikes are covered.'
    kind: rule_applied_by_analogy
  - field: max_depth_m
    value: 0.21
    source_id: kia_owner_manual_ab_2023
    locator: Driving in flooded areas
    statement: '"Avoid driving through flooded areas unless you are sure the water is no higher than the bottom of the wheel hub." (car,
      same hub rule)'
    kind: rule_applied_by_analogy
  - field: max_depth_m
    value: 0.21
    source_id: honda_vn_lead_abs
    locator: 'Spec table: rear tyre 100/90-10 56J'
    statement: Outer diameter = 10 x 25.4 + 2 x 100 x 90/100 = 434.0 mm; hub height 0.217 m; floor to 0.21 m.
    kind: derived
  - field: max_depth_m
    value: 0.21
    source_id: wikipedia_tire_code
    locator: Overall diameter formula
    statement: (2xTxA/100) + (Wx25.4) mm.
    kind: derived
  - field: caution_depth_m
    value: 0.134
    source_id: honda_vn_wave_alpha_110
    locator: 'Spec table: Khoảng sáng gầm xe'
    statement: 134 mm - lowest published ground clearance of the five reference motorbikes (Vision 175, Exciter 150, Air Blade 142,
      Lead 140).
    kind: verbatim_value_interpretation_unverified
  - field: max_depth_flowing_m
    value: 0.15
    source_id: vicses_15_to_float
    locator: Campaign page
    statement: 'Smallest moving-water figure: a 1.05 t small car is moved by 15 cm of water at 3.6 km/h; a motorbike plus rider is lighter
      than this.'
    kind: proxy
  - field: qualitative
    value: null
    source_id: honda_vn_faq
    locator: 'FAQ: khi sử dụng xe trong mùa mưa'
    statement: If the engine stalls in floodwater, do not restart; move the bike out of the water; change oil if water entered; have
      final-drive oil checked at a HEAD dealer. No depth given.
    kind: qualitative
  - field: qualitative
    value: null
    source_id: vnexpress_khi_xe_may_loi_nuoc
    locator: Article text
    statement: High-mounted spark plug and air filter (just under the seat) survive best; water also enters through the exhaust and
      crankcase vent hose. No cm values.
    kind: qualitative
  note: Above max_depth_m treat a motorbike as not passable. Honda Việt Nam warns that a bike that stalls in floodwater may have water
    in the cylinder (see honda_vn_faq). Engine-stall depth for specific models (exhaust or air-intake height) is not published; measure
    on a sample of Vision/Lead/Wave bikes if this class matters to the demo.
