    still_m: 0.4
    flowing_m: 0.3
    note: 0.4 m = Shand et al. large passenger car (still water); 0.3 m = NWS "12 inches of rushing water to carry away most cars" /
      VicSES mid-sized car.
  unverified: false
  selection: 'Still: Shand et al. small passenger car limiting still-water depth (0.3 m, verbatim), which also equals the wheel-hub
    height of the three reference cars (0.292-0.316 m). Flowing: VicSES small car (0.15 m). Caution: NWS 6 in "reach the bottom of most
    passenger cars". The reference cars are 3.6-4.5 m long, ground clearance 0.133-0.165 m.'
  evidence:
  - field: max_depth_m
    value: 0.3
    source_id: wrl_2014_07
    locator: Table 4-2 (Shand et al. 2011), small passenger vehicle
    statement: 'Length < 4.3 m, kerb weight < 1250 kg, ground clearance < 0.12 m: limiting still-water depth 0.3 m; limiting velocity
      3.0 m/s; D.V <= 0.3. Large passenger (> 4.3 m, > 1250 kg, > 0.12 m): 0.4 m; D.V <= 0.45. Authors call these draft interim criteria.'
    kind: verbatim
  - field: max_depth_m
    value: 0.3
    source_id: wrl_2014_07
    locator: p.3 quoting SCARM 2000 App. J
    statement: '"Small, light, low motor vehicles crossing rapidly flowing causeways can become unstable when water depths exceed 0.3
      m. Evacuation by larger, higher sedans is generally only possible and safe when water depths are less than 0.4 m."'
    kind: verbatim
  - field: max_depth_m
    value: 0.3
    source_id: kia_owner_manual_ab_2023
    locator: Driving in flooded areas
    statement: 'Manufacturer: water "no higher than the bottom of the wheel hub". Reference-car hub heights (derived from published
      tyre sizes): Vios 0.301, Morning 0.292, Accent 0.311-0.316 m.'
    kind: rule_cross_check
  - field: max_depth_m
    value: 0.3
    source_id: tuoitre_danang_handbook
    locator: Handbook rule as quoted
    statement: Water not above the wheel centre (trục bánh xe).
    kind: rule_cross_check
