- id: pedestrian_child_elderly
  label_en: Pedestrian - child or elderly person
  label_vi: Người đi bộ (trẻ em hoặc người cao tuổi)
  max_depth_m: 0.25
  max_depth_flowing_m: 0.15
  caution_depth_m: null
  max_dv_m2s: 0.4
  source_ceiling:
    still_m: 0.5
    flowing_m: 0.2
    note: 'Cox et al. 2010 children (height x mass 25-50 mKg) in good conditions: 0.5 m still; at 3.0 m/s only D < 0.2 m. No elderly-specific
      number exists in the sources.'
  advice: avoid_entering_floodwater_if_possible
  unverified: true
  unverified_fields: &id001
  - max_depth_flowing_m
  unverified_reason: No child- or elderly-specific flowing-water figure beyond the Cox et al. laboratory value (D < 0.2 m at 3 m/s,
    children only). 0.15 m is the general-person value (GOV.UK / NWS) applied as a conservative cap.
  selection: 'Lowest of the still-water figures: 0.25 m (FD2321 urban band, derived) < 0.3 m (ARR H1) < 0.5 m (Cox children, good conditions).'
  evidence:
  - field: max_depth_m
    value: 0.25
    source_id: defra_fd2321_tr2
    locator: Tables 4.1 and 4.2
    statement: 'Urban DF = 1 above 0.25 m: HR = 0.5d + 1 >= 1.1 even in still water, i.e. "Dangerous for some (i.e. children)" (0.75-1.25).
      At d <= 0.25 m HR is Low.'
    kind: derived
  - field: max_depth_m
    value: 0.3
    source_id: aidr_guideline_7_3
    locator: Tables 1-2, class H1
    statement: 'H1 "Generally safe for vehicles, people and buildings": D <= 0.3 m, D*V <= 0.3 m2/s. H3 "Unsafe for vehicles, children
      and the elderly" starts above the H2 limit of 0.5 m.'
    kind: verbatim
  - field: source_ceiling.still_m
    value: 0.5
    source_id: wrl_2014_07
    locator: Table 4-1 note 1 (Cox et al. 2010)
    statement: '"Maximum depth stability limit of 1.2 m for adults and 0.5 m for children under good conditions."'
    kind: verbatim
  - field: max_dv_m2s
    value: 0.4
    source_id: wrl_2014_07
    locator: Table 4-1 / p.17 (Cox et al. 2010)
    statement: 'Children (H.M 25-50): low hazard for D x V < 0.4 m2/s; 0.4-0.6 "Significant Hazard; Dangerous to most".'
    kind: verbatim
  - field: max_depth_flowing_m
    value: 0.15
    source_id: govuk_flash_flooding
    locator: Flash flooding guidance
    statement: 15 cm of flood water "can knock a person over" (person, not specifically a child).
    kind: verbatim
  - field: source_ceiling.flowing_m
    value: 0.2
    source_id: wrl_2014_07
    locator: p.17 quoting Cox et al. 2010
    statement: 'Children: "a maximum velocity of 3.0 m/s at shallow depths (D < 0.2 m)".'
    kind: verbatim
  - field: advice
    value: avoid
    source_id: wrl_2014_07
    locator: Table 4-1 note 2
    statement: '"More vulnerable community members such as infants and the elderly should avoid exposure to floodwater. Flood flows
      are considered extremely hazardous to these community members under all conditions."'
    kind: verbatim
  note: Use the child/elderly class whenever the person is not clearly a healthy adult. The elderly and infants have no quantified safe
    depth in any source read.
