id: valencia
name: Valencia (Horta Sud)
country: Spain
language: Spanish             # residents' language: voice bias, local summaries
center: [39.425, -0.405]      # lat, lon
zoom: 13
roads: valencia_roads.json    # scripts/build_roads.py from an OSM extract
                              # bbox lat 39.395..39.472, lon -0.465..-0.375 (Alaquàs to Alfafar, Catarroja to Xirivella)
scenario: scenario-valencia.json
story: >-
  On 29 October 2024 a cut-off low (DANA) stalled over eastern Spain: AEMET's Turís station
  recorded 185 mm in one hour and 621 mm in six hours, and Chiva nearly 500 mm in eight hours,
  while the Poyo ravine (Barranc de Xiva) overflowed through the Horta Sud towns of Paiporta,
  Sedaví, Alfafar, Benetússer, Catarroja and Massanassa. The official toll for Valencia province
  stands at 232 dead and more than 100,000 vehicles were damaged, most of it within a few hours
  of the water arriving.
