# A city Floodline serves: its streets, its residents' language, its demo.
id: hue
name: Huế
country: Vietnam
language: Vietnamese          # residents' language: voice bias, local summaries
center: [16.467, 107.585]     # lat, lon
zoom: 14
roads: hue_roads.json         # scripts/build_roads.py from an OSM extract
scenario: scenario-hue.json
story: >-
  Central Vietnam floods every October-November. In 2025, 32 of Huế's 40 communes were under
  1-2 m of water; in October 2026 the city took more than 800 mm of rain in three days.
