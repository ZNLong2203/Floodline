name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check floodline evals tests scripts
      - run: uv run ruff format --check floodline evals tests scripts
      - run: uv run pytest -q
      - name: Demo scenario replays without an API key
        env:
          FLOODLINE_MODEL_MODE: replay
          FLOODLINE_STATE_DIR: /tmp/floodline
        run: uv run floodline seed --city hue

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
